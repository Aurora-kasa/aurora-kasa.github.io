<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星域长剑：零重力逃生 (Ultimate)</title>
    <!-- 链接外部 CSS 文件 -->
    <link rel="stylesheet" href="style.css">
    <!-- 引入 Tailwind CSS (如果需要) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div class="game-container">
        <!-- UI 面板：显示分数、生命值、能量等 -->
        <div class="ui-panel">
            <div class="flex items-center">
                <span class="text-lg mr-2 text-yellow-400">得分 (Score):</span>
                <span id="score-display" class="text-xl font-bold">0</span>
            </div>
            <div class="flex items-center">
                <span class="text-lg mr-2 text-red-500">生命 (HP):</span>
                <div class="resource-bar">
                    <div id="hp-bar" class="h-full bg-red-600 transition-all duration-300" style="width: 100%;"></div>
                </div>
            </div>
            <div class="flex items-center">
                <span class="text-lg mr-2 text-blue-400">能量 (Energy):</span>
                <div class="resource-bar">
                    <div id="energy-bar" class="h-full bg-blue-500 transition-all duration-300" style="width: 100%;"></div>
                </div>
            </div>
            <button id="pause-button">暂停/继续</button>
        </div>

        <!-- 游戏画布 -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- 游戏状态/模态框：用于开始、结束和设置 -->
        <div id="start-modal" class="game-status">
            <div class="modal-content">
                <h2>星域长剑：零重力逃生</h2>
                <p class="text-xl mb-6">穿越废弃空间站，避开碎片和敌舰，逃离星域！</p>
                <button id="start-game-button" class="mt-4">开始任务</button>
            </div>
        </div>

        <div id="game-over-modal" class="game-status hidden">
            <div class="modal-content">
                <h2 id="game-over-title">任务失败</h2>
                <p class="text-2xl mt-4 mb-8">最终得分: <span id="final-score" class="text-yellow-400 font-bold">0</span></p>
                <button id="restart-game-button">重新部署</button>
            </div>
        </div>
    </div>

    <!-- 链接外部 JavaScript 文件，使用 defer 确保在 HTML 解析完成后执行 -->
    <script src="game.js" defer></script>
</body>
</html>
